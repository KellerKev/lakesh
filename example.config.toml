# lakesh config — see `lakesh config init` for a copy of this written to
# your $XDG_CONFIG_HOME/lakesh/config.toml (or ~/.config/lakesh/config.toml).

default = "local"

# --- Iceberg REST profile (most common) -----------------------------------

[profiles.local]
uri       = "http://127.0.0.1:8181"
warehouse = "lake"

[profiles.local.s3]
endpoint   = "http://127.0.0.1:9000"
region     = "us-east-1"
access_key = "minioadmin"
secret_key = "minioadmin"
path_style = true

# Uncomment if your local catalog has DUCKICELAKE_OAUTH_CLIENTS configured.
# [profiles.local.oauth]
# client_id     = "demo-client"
# client_secret = "demo-secret"

# --- DuckLake direct profile (bypass the Iceberg REST layer) --------------
# Useful for write-heavy workloads, since the duckdb-iceberg extension is
# read-only today. Same underlying data as the `local` profile above, just
# via `ducklake:postgres:...` instead of an HTTP catalog.

# [profiles.lake_direct]
# type         = "ducklake"
# postgres_dsn = "dbname=ducklake host=/tmp/.pgsock port=55432 user=ducklake"
# data_path    = "s3://lakehouse/data/"
# catalog      = "lake"
#
# [profiles.lake_direct.s3]
# endpoint   = "http://127.0.0.1:9000"
# access_key = "minioadmin"
# secret_key = "minioadmin"

# --- Production profile using environment-backed secrets ------------------

# [profiles.prod]
# uri       = "https://catalog.prod.example.com"
# warehouse = "prod"
#
# [profiles.prod.s3]
# region = "us-west-2"
# # access_key + secret_key come from IAM role / IRSA automatically when omitted.
#
# [profiles.prod.oauth]
# client_id_env     = "LAKESH_PROD_CLIENT_ID"
# client_secret_env = "LAKESH_PROD_CLIENT_SECRET"
# # Or point at an external IdP with scope/audience:
# # token_endpoint = "https://idp.example.com/oauth2/token"
# # scope          = "catalog:read catalog:write"

# --- ADBC profile: query any database with an ADBC driver -----------------
# Uses the adbc_scanner DuckDB community extension (loaded automatically).
# Install drivers with the `dbc` CLI (https://dbc.columnar.tech):
#     dbc install postgresql
# `driver` accepts a manifest name or a full path to the shared library.

# The postgresql driver takes credentials in the URI (it rejects
# username/password options). A password in the config file is fine, or
# use `uri_env` to source the whole DSN from an env var instead.
# Drivers that do support option-based auth (e.g. flightsql) can use an
# [profiles.X.options] table with username / password_env keys.

# [profiles.pg]
# type      = "adbc"
# driver    = "postgresql"
# uri       = "postgresql://reporting:s3cret@db.example.com:5432/appdb"
# # uri_env = "LAKESH_PG_DSN"    # alternative; literal `uri` wins if both set
# catalog   = "pg"            # tables appear as pg.<schema>.<table>
# read_only = true

# --- ADBC + OAuth2 device-code login (e.g. Snowflake via an IdP) ----------
# Run `lakesh auth login -p snow` once; tokens are cached + refreshed in
# $XDG_STATE_HOME/lakesh/tokens.json. Grants: client_credentials |
# device_code | authorization_code (PKCE, opens your browser).

# [profiles.snow]
# type         = "adbc"
# driver       = "snowflake"
# catalog      = "snow"
# token_option = "adbc.snowflake.sql.client_option.auth_token"
#
# [profiles.snow.options]
# "adbc.snowflake.sql.account" = "myorg-account1"
# username                     = "kevin"
#
# [profiles.snow.oauth]
# grant                         = "device_code"
# client_id                     = "lakesh-cli"
# device_authorization_endpoint = "https://idp.example.com/oauth2/v1/device/authorize"
# token_endpoint                = "https://idp.example.com/oauth2/v1/token"
# scope                         = "session:role:ANALYST offline_access"
