[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakesh"
version = "0.1.0"
description = "DuckDB-powered SQL CLI for Iceberg REST catalogs — profiles, interactive REPL, one-shot queries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kevin Keller", email = "kellerkev@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "duckdb>=1.4,<2",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "prompt-toolkit>=3.0,<4",
    "httpx>=0.27,<1",
    # FastMCP server (stdio) — `lakesh mcp` entry. The <2 ceiling is load
    # bearing: MCP SDK 2.0 moved FastMCP out of the SDK and deleted
    # `mcp.server.fastmcp`, so an unpinned install resolves 2.x and
    # `lakesh mcp` dies on import. An MCP client shows that only as a
    # session with no lakesh tools — no error the user ever sees.
    # Lifting the ceiling means porting mcp.py to the 2.x MCPServer API.
    "mcp>=1.0,<2",
    # DuckDB defers to pytz when converting TIMESTAMP WITH TIME ZONE into
    # Python (it hands back pytz.tzfile tzinfo objects) but declares no
    # dependency on it. Without pytz anything tz-aware raises "Required
    # module 'pytz' failed to import" — including Snowflake's SHOW
    # DATABASES and most of ACCOUNT_USAGE.
    "pytz",
    # tomllib is stdlib on 3.11+; no extra dep needed.
]

[project.optional-dependencies]
# Custom masking rules only. User-supplied regexes are untrusted input,
# and RE2 compiles to a DFA that cannot backtrack — so a pattern like
# `(a+)+$`, which hangs `re` on 32 characters, runs in linear time. The
# shipped rules need lookarounds (RE2 has none) and stay on `re`, so the
# base install is unaffected.
mask = ["google-re2"]
# Signed session attestation. Off by default because most profiles only
# need the client-asserted stamp; a signature is only worth its weight
# when a policy on the source actually verifies it.
sign = ["pyjwt>=2.8", "cryptography>=42"]
# Python query backends (type = "python"). Each wraps a PEP 249 driver
# behind lakesh's Session interface; the base install ships none of them
# because the ADBC path is the default. `duckdb` needs no extra — it is
# already a core dependency and serves as the reference backend.
snowflake-python = ["snowflake-connector-python>=3.12"]
postgres-python = ["psycopg[binary]>=3.1"]
# pyiceberg backend: the data-pull family. Metadata from the catalog API,
# data scanned to Arrow and queried in an in-process DuckDB — for Iceberg
# catalogs (incl. non-REST: Glue, Hive, SQL) with no information_schema.
iceberg-python = ["pyiceberg[pyarrow]>=0.10,<1"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23",
]

[project.scripts]
lakesh = "lakesh.cli:app"

[project.urls]
Homepage = "https://github.com/KellerKev/lakesh"
Issues = "https://github.com/KellerKev/lakesh/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lakesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
