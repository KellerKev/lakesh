# pixi manifest for lakesh — https://pixi.sh
#
# Quick start:
#   pixi install            # create the env and install lakesh (editable)
#   pixi run lakesh         # drop into the REPL
#   pixi run doctor         # verify catalog connectivity
#   pixi run -e dev test    # run the test suite
#
# Global install (a `lakesh` on your PATH, no venv to activate):
#   pixi global install --path .
# Then just run `lakesh` from anywhere. Uninstall with `pixi global uninstall lakesh`.

[workspace]
name = "lakesh"
version = "0.1.0"
description = "DuckDB-powered SQL CLI for Iceberg REST catalogs — profiles, interactive REPL, one-shot queries"
authors = ["Kevin Keller <kellerkev@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

# Conda-provided toolchain. Everything else (duckdb, typer, rich, ...) comes
# from PyPI via the editable install of lakesh below, driven by pyproject.toml.
[dependencies]
python = ">=3.11,<3.13"

# Install lakesh itself, editable, resolving its runtime deps from pyproject.toml.
[pypi-dependencies]
lakesh = { path = ".", editable = true }

[tasks]
lakesh = "lakesh"
repl = "lakesh"
doctor = "lakesh doctor"
config-init = "lakesh config init"
mcp = "lakesh mcp"

# --- dev environment: adds the test toolchain ----------------------------
[feature.dev.pypi-dependencies]
pytest = ">=8,<9"
pytest-asyncio = ">=0.23"

[feature.dev.tasks]
test = "pytest"
test-config = "pytest tests/test_config.py"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
