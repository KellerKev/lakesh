# Example lakesh config: querying a Postgres database through ADBC.
# Everything here is fake — swap in your own host, database, and password.
#
# Setup:
#   1. Install the driver:            dbc install postgresql
#      (or point `driver` at a libadbc_driver_postgresql shared library)
#   2. Copy this file:                cp examples/config.postgres-adbc.toml \
#                                        ~/.config/lakesh/config.toml
#   3. Check connectivity:            lakesh doctor
#   4. Query away:                    lakesh exec -q 'SELECT * FROM pg.public.users LIMIT 5'
#      or drop into the REPL:         lakesh

default = "pg"

[profiles.pg]
type      = "adbc"
driver    = "postgresql"
# The postgresql ADBC driver takes credentials in the URI:
#
#   postgresql://USERNAME:PASSWORD@HOST:PORT/DATABASE
#                └──┬───┘ └──┬───┘
#             pg username  pg password (URL-encode special chars, e.g. @ → %40)
#
# Here USERNAME=reporting and PASSWORD=hunter2. A password in the config
# file is fine; use `uri_env` instead if you'd rather source the whole
# DSN from an env var (literal `uri` wins if both are set).
uri       = "postgresql://reporting:hunter2@db.example.com:5432/appdb"
# uri_env = "LAKESH_PG_DSN"
catalog   = "pg"          # tables appear as pg.<schema>.<table>
read_only = true          # drop this to allow adbc_execute()/adbc_insert()

# A second profile against the same server's staging database — switch
# with `lakesh -p staging`.
[profiles.staging]
type    = "adbc"
driver  = "postgresql"
uri     = "postgresql://reporting:hunter2@db.example.com:5432/staging"
catalog = "stg"

# ---------------------------------------------------------------------------
# Freshness: what Postgres cannot tell you
#
# You can annotate tables here exactly as in the Snowflake example:
#
#   [profiles.pg.tables]
#   "public.orders" = { status = "canonical", note = "the one to use" }
#
# ...but the FRESHNESS half will report `state: "unknown"` on Postgres,
# and that is deliberate. ANSI information_schema.tables has no temporal
# column at all, and the only timestamps Postgres exposes
# (pg_stat_user_tables.last_analyze / last_autovacuum) are
# statistics-collector artifacts: NULL until autovacuum happens to fire,
# wiped by pg_stat_reset(), and decoupled from when a row last landed.
#
# Surfacing one of those as `last_modified` would hand an agent a vacuum
# timestamp labelled as data freshness — worse than reporting nothing,
# because "unknown" makes an agent go and ask while a wrong timestamp
# makes it confidently proceed.
#
# What you do get on Postgres is size: `bytes` from
# pg_total_relation_size, and a `row_count` from pg_class.reltuples
# flagged `row_count_is_estimate`. A table that has never been ANALYZEd
# reports no count at all rather than zero.
